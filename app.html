<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#121211">
<title>Trainingstagebuch – App</title>
<meta name="description" content="Trainingstagebuch: Sätze mit Gewicht und Wiederholungen eintragen, Ziel für jedes Training, über 100 Übungen mit Animation. 24 h gratis testen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
    --line:#383835; --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;
    --accent:#3987e5; --accent-strong:color-mix(in srgb, var(--accent) 72%, #fff); --accent-soft:color-mix(in srgb, var(--accent) 17%, transparent);
    --good:#0ca30c; --good-text:#3fc23f; --good-soft:rgba(12,163,12,.18); --critical:#e66767;
    --radius:16px; color-scheme:dark;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f3f3f1; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e6e5e1;
      --line:#dddcd7; --text:#0b0b0b; --text-2:#52514e; --muted:#77766f;
      --accent-strong:color-mix(in srgb, var(--accent) 78%, #000); --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
      --good:#0a8a0a; --good-text:#087a08; --good-soft:rgba(12,163,12,.14); --critical:#d03b3b; color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f3f3f1; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e6e5e1;
    --line:#dddcd7; --text:#0b0b0b; --text-2:#52514e; --muted:#77766f;
    --accent-strong:color-mix(in srgb, var(--accent) 78%, #000); --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
    --good:#0a8a0a; --good-text:#087a08; --good-soft:rgba(12,163,12,.14); --critical:#d03b3b; color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4}
  body{min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(84px + var(--safe-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px}
  header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;min-width:0}
  header.top h1 .hi{font-size:24px}
  header.top h1 .hi-sub{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px}
  .linkbtn{color:var(--accent-strong);font-weight:600;text-decoration:underline;font-size:inherit}
  .splash{display:none}
  .splash.on{display:flex;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 35%, var(--bg)) 0%, var(--bg) 70%);transition:opacity .45s ease}
  .splash.out{opacity:0;pointer-events:none}
  .sp-in{animation:sp-up .6s cubic-bezier(.2,.8,.2,1) both}
  .sp-logo{width:96px;height:96px;margin:0 auto 18px;padding:12px;border-radius:26px;background:var(--surface);border:1px solid var(--line);color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .sp-hi{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .sp-sub{font-size:18px;color:var(--text-2);margin-top:6px}
  .sp-next{display:inline-block;margin-top:18px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
  .sp-tap{margin-top:28px;font-size:12px;color:var(--muted);animation:sp-pulse 1.6s ease-in-out infinite}
  @keyframes sp-up{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes sp-pulse{50%{opacity:.4}}
  .gear{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);background:var(--surface);border:1px solid var(--line)}
  .gear:active{background:var(--surface-2)}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .swatch{height:52px;border-radius:14px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .swatch.on{border-color:var(--text)}
  .themeseg button{height:42px}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--good)} .dot.busy{background:var(--accent)}

  h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)} .small{font-size:13px} .t2{color:var(--text-2)}
  .title{font-weight:700;font-size:17px}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--critical)}
  .btn.block{width:100%}
  .btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
  .btn:active{transform:scale(.98)}
  .icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
  .icon-btn:active{background:var(--surface-2)}

  /* day switcher */
  .day{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
  .day .lbl{flex:1;text-align:center;font-weight:700}
  .stopwatch{text-align:center;padding:20px 16px}
  .sw-clock{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent-strong);line-height:1.1}
  .sw-clock.idle{color:var(--muted)}
  .sw-btn{height:60px;font-size:20px;margin-top:14px;border-radius:16px;color:#fff}
  .sw-btn.go{background:var(--good);border-color:var(--good)}
  .sw-btn.stop{background:var(--critical);border-color:var(--critical)}
  .badge.run{background:var(--accent)}
  .timerbar{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums}
  .timerbar .end-btn{color:var(--critical);height:34px;flex:none}
  .timerbar .tclock{color:var(--accent-strong);font-size:16px}
  .day button.lbl{background:none;border:0;padding:4px 0;border-radius:10px}
  .day button.lbl:active{background:var(--surface-2)}
  .cal-ic{display:inline-block;vertical-align:-4px;margin-left:2px}
  .calsvg{display:inline-block;vertical-align:middle}
  .small .calsvg{vertical-align:-3px}
  .cal{padding:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal-head div{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:2px 0 6px}
  .cal-cell{min-width:0;padding-left:0;padding-right:0;aspect-ratio:1/1.15;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:5px;font-variant-numeric:tabular-nums}
  .cal-cell.empty{background:none}
  .cal-cell[disabled]{opacity:.35}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .cal-cell.has{background:var(--surface-3)}
  .cal-d{font-size:13px;font-weight:600;color:var(--text-2)}
  .cal-tag{display:inline-block;max-width:100%;padding:2px 4px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;text-align:center;line-height:1.3}
  .cal-tag.big{font-size:13px;padding:3px 7px}
  .cal-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%;padding:0 2px}
  .cal-tags .cal-tag{font-size:9.5px;padding:1px 3px;border-radius:5px;line-height:1.25}
  .cal-more{font-size:9px;color:var(--muted);font-weight:700;line-height:1.5}
  .cal-legend .off{opacity:.45}
  .day-groups{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:2px 0 8px}
  .day-groups .dg{display:inline-flex;align-items:center;gap:6px}
  .cal-tag.plan{background:transparent !important;border:2px dashed;padding:0 3px}
  .cal-cell.planned{background:var(--surface)}
  .cal-cell.missed{opacity:.5}
  .cal-time{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
  .planrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left;font-weight:600}
  .planbanner{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
  .planbanner.next{width:100%;border-color:var(--line);background:var(--surface)}
  .chipwrap{display:flex;flex-wrap:wrap;gap:6px}
  .chipsel{padding:8px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px}
  .chipsel.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:4px;font-size:13px;color:var(--text-2)}
  .cal-legend i{font-style:normal;display:inline-block;color:#fff;font-weight:800;font-size:11px;border-radius:5px;padding:1px 5px;margin-right:5px}
  .day .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}

  /* exercise grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  .tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:118px}
  .tile:active{transform:scale(.97)}
  .tile .ic{width:64px;height:64px;color:var(--accent)}
  .tile .nm{font-size:13px;font-weight:600;line-height:1.2;hyphens:auto;-webkit-hyphens:auto;word-break:break-word}
  .tile.done{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--good-soft)),var(--surface)}
  .tile .badge{position:absolute;top:6px;right:6px;background:var(--good);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px}
  .tile .last{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .tile.done .last{background:var(--surface)}
  .searchbox{margin:16px 0 0}
  .searchbox input{height:46px;font-size:16px}
  .cathead{display:flex;align-items:center;gap:10px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;text-align:left}
  .cathead span:first-child{flex:1}
  .cathead .chev{color:var(--muted)}
  .cathead .okc{color:var(--good-text)}
  .catgrid{margin:10px 0 6px}
  .rcards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .rcards::-webkit-scrollbar{display:none}
  .rcard{flex:none;width:138px;min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
  .rcard .rname{font-weight:700;font-size:15px;line-height:1.2;margin-top:4px}
  .rcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted)}
  .rcard.add .plus{font-size:28px;line-height:1}
  .rcard:active,.rrow:active{transform:scale(.98)}
  .rbox{margin-top:14px;padding:14px}
  .rprog{font-size:14px;color:var(--muted)} .rprog b{font-size:22px;color:var(--text)}
  .rbar{height:5px;border-radius:3px;background:var(--surface-3);margin:10px 0 6px;overflow:hidden}
  .rbar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .3s}
  .rrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 2px;border-top:1px solid var(--line);text-align:left}
  .rrow .ic,.rerow .ic{width:42px;height:42px;flex:none;color:var(--accent)}
  .rrow .nm{display:block;font-weight:600;line-height:1.2}
  .rrow .last{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-radius:99px;padding:1px 7px}
  .rrow .rst{font-size:12px;font-weight:700;color:var(--good-text);white-space:nowrap}
  .rrow.done .nm{color:var(--text-2)}
  .rnum{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .rrow.done .rnum{background:var(--good);color:#fff}
  .rerow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
  .rerow:first-child{border-top:0}
  .rerow .nm{font-weight:600;font-size:14px}
  .rpromo{margin-top:14px}
  .tile.pick.on{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
  .tile.pick.on .badge{background:var(--accent)}
  .pickdone{position:sticky;bottom:calc(76px + var(--safe-bottom));margin-top:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .nextbtn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:46px}
  .info-btn{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-weight:800;font-family:Georgia,serif;font-style:italic;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .info-btn:active{background:var(--accent-soft)}
  .info-bg{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadein .15s ease}
  .info-card{position:relative;width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
  .info-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}
  .info-ic{width:46px;height:46px;flex:none;color:var(--accent)}
  .info-txt{font-size:15px;line-height:1.45}
  .info-card{max-height:calc(100vh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .xa{margin:2px 0 10px}
  .xa-st{background:var(--surface-2);border-radius:14px;padding:6px 6px 0}
  .xa-st svg{display:block;width:100%;max-height:210px;color:var(--accent)}
  .xsv .fg{fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
  .xsv .b2 .fg{opacity:.5}
  .xsv .hd{fill:currentColor}
  .xsv .eq{fill:none;stroke:var(--text-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .xsv .eqf{fill:var(--text-2)}
  .xsv .gr{stroke:var(--line);stroke-width:2}
  .xsv .cb{stroke:var(--text-2);stroke-width:1;stroke-dasharray:2 1.5;opacity:.8}
  .xsv .xh{fill:none;stroke:#ff9f0a;stroke-width:1.6}
  .xsv .xhf{fill:#ff9f0a}
  .xsv .xd{stroke:#ff9f0a;stroke-width:1.3;stroke-dasharray:2.5 2;fill:none}
  .xa-ph{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:8px;min-height:14px}
  .xa-cue{display:flex;gap:8px;align-items:flex-start;min-height:40px;margin-top:4px;font-weight:600;font-size:15px;line-height:1.35}
  .xa-cue b,.xa-ol li::marker{color:#ff9f0a}
  .xa-cue b{flex:none;width:21px;height:21px;border-radius:50%;background:#ff9f0a;color:#000 !important;display:grid;place-items:center;font-size:12px}
  .xa-bar{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
  .xa-bar i{display:block;height:100%;background:var(--accent);width:0}
  .xa-ctl{display:flex;gap:6px;margin-top:8px}
  .xa-ctl button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-weight:600;font-size:13px}
  .xa-ctl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .xa-ol{margin:4px 0 10px;padding-left:20px;font-size:14px;line-height:1.4;color:var(--text-2)}
  .xa-ol li{margin:2px 0}
  .xa-ol li.on{color:var(--text);font-weight:600}
  .info-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted);margin:10px 0 4px}

  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .tile.add{justify-content:center;color:var(--muted);border-style:dashed}
  .tile.add .plus{font-size:30px;line-height:1}

  /* icons */
  svg.ex{display:block;overflow:visible}
  svg.ex .fg{fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
  svg.ex .hd{fill:currentColor}
  svg.ex .eq{fill:none;stroke:var(--text-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  svg.ex .eqf{fill:var(--text-2)}
  svg.ex .gr{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}

  /* exercise screen */
  .ex-hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
  .ex-hero .ic{width:84px;height:84px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;color:var(--accent)}
  .ex-hero h2{all:unset;font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.15}
  .target{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .target b{color:var(--accent-strong)}
  .sets{width:100%;border-collapse:separate;border-spacing:0 8px}
  .sets th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:0 4px}
  .sets td{text-align:center;padding:0 4px;vertical-align:middle}
  .sets td.n{width:34px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .sets input{width:100%;height:52px;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;outline:none;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .sets input:focus{border-color:var(--accent)}
  .sets .prev{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .sets tr.up input{border-color:var(--good)}
  .sets tr.tgt td{padding-top:6px}
  .sets tr.tgt + tr td{padding-top:0}
  .goal{font-size:12px;font-weight:600;color:var(--accent-strong);text-align:left;padding:0 2px;margin-bottom:-4px}
  .goal.wu{color:var(--muted);font-weight:500}
  .sets tr.wu input{opacity:.7;border-style:dashed}
  .setno{width:30px;height:30px;border-radius:9px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .setno.is-wu{background:#c98500;border-color:#c98500;color:#fff}
  .goal.hit{color:var(--good-text)}
  .pr{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--good);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .delta{font-weight:700}
  .delta.up{color:var(--good-text)} .delta.down{color:var(--critical)}

  /* tabs */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);z-index:20}
  nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;font-weight:500;color:var(--muted)}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:24px;height:24px}

  /* forms */
  input.f,select.f,textarea.f{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;outline:none}
  textarea.f{height:140px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:12px}
  input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
  label.lab{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  .icon-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:230px;overflow:auto}
  .icon-pick button{border:2px solid transparent;border-radius:12px;background:var(--surface-2);padding:4px;color:var(--accent)}
  .icon-pick button.on{border-color:var(--accent)}
  .icon-pick svg{width:100%;height:auto}

  /* history */
  .sess-ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .sess-ex:first-of-type{border-top:0}
  .sess-ex .ic{width:34px;height:34px;flex:none;color:var(--accent)}

  /* chart */
  .chart-wrap{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
  .tip b{font-size:14px}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:76px;padding:6px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--text-2)}
  .chip svg{width:40px;height:40px;color:var(--accent)}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .chip span{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.data{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:6px 0}
  table.data td{padding:8px 0;border-top:1px solid var(--line)}
  table.data .r{text-align:right}
  table.data td:first-child{white-space:nowrap;padding-right:12px}

  .empty{text-align:center;padding:30px 16px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:6px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px;padding-bottom:calc(12px + var(--safe-bottom))}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal .acts{display:flex;gap:10px;margin-top:16px}
  .modal .acts .btn{flex:1}
  .toast{position:fixed;left:50%;top:calc(14px + var(--safe-top));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
  .lic-ov{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + var(--safe-top));overflow:auto;
    background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 30%, var(--bg)) 0%, var(--bg) 72%)}
  .lic-box{width:100%;max-width:380px;text-align:center;animation:sp-up .5s cubic-bezier(.2,.8,.2,1) both}
  .lic-h{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .lic-p{color:var(--text-2);font-size:16px;line-height:1.45;margin:10px 0 16px}
  .lic-p.small{font-size:14px;color:var(--muted)}
  .lic-box .f{height:50px;font-size:17px;text-align:center;margin-bottom:10px;width:100%}
  .lic-key{margin-top:12px}
  .lic-err{color:#e5484d;font-size:14px;min-height:20px;margin-top:8px}
  .lic-have{margin-top:18px;font-size:14px;color:var(--muted)}
  .lic-have summary{cursor:pointer;color:var(--accent-strong);font-weight:600;list-style:none}
  .lic-bar{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:12px;
    background:color-mix(in srgb, var(--accent) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));font-size:14px;color:var(--text)}
  .lic-bar b{color:var(--accent-strong)}

</style>
</head>

const e1rm = (w, r) => (r == null || r <= 0) ? null : (w == null || w <= 0 ? null : (r === 1 ? w : w * (1 + r / 30)));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };

const LANG = (() => { const p = lsGet('tt_prefs') || {}; if (p.lang === 'de' || p.lang === 'en') return p.lang; return (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en'; })();

const pad = n => String(n).padStart(2, '0');

    fig({ h:[33,8], s:[33,16], p:[33,33], legs:[[[33,42],[31,47],[38,50]]], arms:[[[34,24],[34,32]]] }) + dbV(34, 37),
  seatedcalf: ground() + `<rect class="eq" x="38" y="53" width="12" height="5" rx="1"/>` + EQ([10,42],[26,42]) + EQ([16,42],[16,58]) +
    `<rect class="eqf" x="28" y="31" width="14" height="5" rx="2"/>` + EQ([35,31],[35,10]) +
    fig({ h:[17,12], s:[18,20], p:[21,39], legs:[[[36,39],[38,50],[46,53]]], arms:[[[26,29],[30,33]]] }),

  const step = w >= 20 ? 2.5 : 1;

}

  const t = s.wu ? null : setTarget(prevW.length ? (prevW[wi] || prevW[prevW.length - 1]) : null);

  const hit = t && cr != null && ((cr >= t.r && (t.w == null || (cw != null && cw >= t.w - 1e-9))) || (t.w != null && cur != null && cur >= e1rm(t.w, t.r) - 1e-9));

    : s.wu ? `<tr class="tgt"><td></td><td colspan="2"><div class="goal wu">Aufwärmsatz · zählt nicht für Ziele und Rekorde</div></td><td></td></tr>` : '';
  return goal + `<tr class="${up ? 'up' : ''} ${s.wu ? 'wu' : ''}"><td class="n"><button class="setno ${s.wu ? 'is-wu' : ''}" data-act="toggle-wu" data-i="${i}" aria-label="${s.wu ? 'Aufwärmsatz – tippen für Arbeitssatz' : 'Satz ' + (wi + 1) + ' – tippen für Aufwärmsatz'}">${s.wu ? 'A' : wi + 1}</button></td>

    <td><input inputmode="numeric" data-in="r" data-i="${i}" value="${s.r ?? ''}" placeholder="${t ? t.r : (p && p.r != null ? p.r : '0')}">${p ? `<div class="prev">zuletzt ${p.r ?? '–'}${isPR ? '<span class="pr">Rekord</span>' : ''}</div>` : (isPR ? '<div class="prev"><span class="pr">Rekord</span></div>' : '')}</td>

function fixCat(c) { return c === 'Aufwärmen' ? 'Cardio' : c; }

/* ---- Progress ---- */
const METRICS = { max: ['Max. Gewicht', 'kg'], orm: ['1RM (geschätzt)', 'kg'], reps: ['Max. Wdh.', 'Wdh.'], vol: ['Volumen', 'kg'] };
function seriesFor(exId, metric) {
  const pts = [];
  Object.keys(S.days).sort().forEach(k => {
    const e = S.days[k].entries.find(x => x.exId === exId); if (!e) return;
    const sets = validSets(e.sets).some(x => x.m != null) ? validSets(e.sets) : workSets(e.sets); if (!sets.length) return;
    let v = null;
    if (metric === 'max') v = Math.max(...sets.map(s => s.w ?? -Infinity));
    if (metric === 'orm') v = Math.max(...sets.map(s => e1rm(s.w, s.r) ?? -Infinity));
    if (metric === 'reps') v = Math.max(...sets.map(s => s.r ?? -Infinity));
    if (metric === 'vol') v = volume(sets);
    if (metric === 'min') v = sets.reduce((a, s) => a + (s.m || 0), 0);
    if (isFinite(v) && v > 0) pts.push({ k, t: keyDate(k).getTime(), v, sets });
  });
  return pts;
}
function viewProgress() {
  const used = new Map();
  Object.values(S.days).forEach(d => d.entries.forEach(e => { if (validSets(e.sets).length && !used.has(e.exId)) used.set(e.exId, exById(e.exId) || { id: e.exId, name: e.name, icon: e.icon }); }));
  const list = [...used.values()];
  if (!list.length) return `<div class="empty"><div class="big">📈</div>Sobald du Sätze eingetragen hast, siehst du hier deine Steigerung pro Übung.</div>`;
  if (!S.prog.ex || !used.has(S.prog.ex)) S.prog.ex = list[0].id;
  const x = used.get(S.prog.ex);
  const cardio = x.kind === 'cardio' || isCardio(x.id);

let chartPts = [];

  return t;
}

  const W = 340, H = 190, L = 38, R = 12, T = 10, B = 26;
  const vals = pts.map(p => p.v), ticks = niceTicks(Math.min(...vals), Math.max(...vals));

  const x = t => pts.length === 1 ? (L + W - R) / 2 : L + (t - t0) / (t1 - t0 || 1) * (W - L - R);

  const dl = k => fmtKey(k, { day: '2-digit', month: '2-digit' });
  s += `<text x="${chartPts[0].x}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}" font-size="10" fill="var(--muted)">${dl(pts[0].k)}</text>`;
  if (pts.length > 1) s += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${dl(pts[pts.length - 1].k)}</text>`;

function wireChart() {
  const wrap = $('#chart'); if (!wrap) return;

  const show = ev => {

    let b = chartPts[0]; chartPts.forEach(p => { if (Math.abs(p.x - cx) < Math.abs(b.x - cx)) b = p; });
    xh.setAttribute('x1', b.x); xh.setAttribute('x2', b.x); xh.style.display = '';

function modal({ title, body = '', ok = 'OK', cancel = 'Abbrechen', danger = false, input = false, onOpen }) {

/* ================= Übungs-Animationen =================
   Pose = Gelenkwinkel in Grad (0 = rechts, 90 = unten, -90 = oben) + Wurzelpunkt.
   Glieder: T Rumpf (Hüfte→Schulter), N Hals, Th/Sh Ober-/Unterschenkel, U/F Ober-/Unterarm,
   …2 = zweites Bein/Arm (optional). r = Wurzelgelenk (p,f,s,w,k,h), at = dessen Position.
   fv = Frontansicht (Arme/Beine gespiegelt).                                        */
const XA = (() => {
  const LEN = { T: 17, N: 6.5, Th: 13, Sh: 12.5, U: 10, F: 9.5, Th2: 13, Sh2: 12.5, U2: 10, F2: 9.5 };
  const EDGES = [['p','s','T'],['s','h','N'],['p','k','Th'],['k','f','Sh'],['s','e','U'],['e','w','F'],['p','k2','Th2'],['k2','f2','Sh2'],['s','e2','U2'],['e2','w2','F2']];
  const rad = d => d * Math.PI / 180;
  function solve(o) {
    const a = Object.assign({}, o); if (a.N == null) a.N = a.T;
    const P = { [o.r || 'p']: o.at.slice() }, fv = o.fv;
    // Frontansicht: Anknüpfpunkte versetzt
    const off = { e: fv ? 5 : 0, e2: fv ? -5 : 0, k: fv ? 3 : 0, k2: fv ? -3 : 0 };
    let changed = true;
    while (changed) { changed = false;
      for (const [x, y, key] of EDGES) {
        if (a[key] == null) continue;
        const L = LEN[key], ang = rad(fv && key.endsWith('2') ? 180 - a[key] : a[key]);
        const ox = (off[y] || 0), v = [Math.cos(ang) * L, Math.sin(ang) * L];
        if (P[x] && !P[y]) { P[y] = [P[x][0] + v[0] + ox, P[x][1] + v[1]]; changed = true; }
        else if (P[y] && !P[x]) { P[x] = [P[y][0] - v[0] - ox, P[y][1] - v[1]]; changed = true; }
      }
    }
    if (a.ds) for (const k of ['s','e','w','e2','w2']) if (P[k]) P[k] = [P[k][0], P[k][1] - a.ds];
    return P;
  }
  const lerpAng = (a, b, u) => a + (b - a) * u;
  function blend(A, B, u) {
    const o = Object.assign({}, A);
    for (const k in A) if (typeof A[k] === 'number' && typeof B[k] === 'number') o[k] = lerpAng(A[k], B[k], u);
    if (B.at) o.at = [A.at[0] + (B.at[0] - A.at[0]) * u, A.at[1] + (B.at[1] - A.at[1]) * u];

  }

  function seg(X) { const c = X.o ? [1.4, 1, 2.8] : [2.8, 1, 1.6]; return [['s', 1.1], ['1', c[0]], ['u', c[1]], ['2', c[2]], ['z', .6]]; }

  function at(X, t) {

    for (const [ph, d] of S) { if (t < acc + d) { const u = (t - acc) / d; const v = ph === '1' ? ease(u) : ph === 'u' ? 1 : ph === '2' ? 1 - ease(u) : 0; return { ph, u, v }; } acc += d; }
    return { ph: 'z', u: 1, v: 0 };

      const L = s => `<line class="xd" style="stroke-dasharray:none;stroke-width:1.8" x1="${(A[0] + s * nx).toFixed(1)}" y1="${(A[1] + s * ny).toFixed(1)}" x2="${(B[0] + s * nx).toFixed(1)}" y2="${(B[1] + s * ny).toFixed(1)}"/>`; return L(1) + L(-1); }
    if (c === '=') { const [a, b] = k.split(''); return `<line class="xd" x1="4" x2="60" y1="${P[b][1].toFixed(1)}" y2="${P[b][1].toFixed(1)}"/><circle class="xh" cx="${P[a][0].toFixed(1)}" cy="${P[a][1].toFixed(1)}" r="5"/>`; }
    if (c === '~') { const A = solve(X.A)[k], B = solve(X.B)[k]; return `<line class="xd" x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}"/><circle class="xh" cx="${P[k][0].toFixed(1)}" cy="${P[k][1].toFixed(1)}" r="5.5"/>`; }
    if (P[m]) return `<circle class="xh" cx="${P[m][0].toFixed(1)}" cy="${P[m][1].toFixed(1)}" r="5.5"/><circle class="xhf" cx="${P[m][0].toFixed(1)}" cy="${P[m][1].toFixed(1)}" r="1.5"/>`;

  }

    gr: (y = 58) => `<line class="gr" x1="3" y1="${y}" x2="61" y2="${y}"/>`,
    ln: (...p) => `<polyline class="eq" points="${p.map(q => q.map(f1).join(',')).join(' ')}"/>`,
    bench: (x1, x2, y, legs = 1) => G.ln([x1, y], [x2, y]) + (legs ? G.ln([x1 + 4, y], [x1 + 4, 58]) + G.ln([x2 - 4, y], [x2 - 4, 58]) : ''),
    plate: (p, r = 6) => `<circle class="eq" cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}"/><circle class="eqf" cx="${f1(p[0])}" cy="${f1(p[1])}" r="1.6"/>`,
    db: (p, vert) => vert ? `<rect class="eqf" x="${f1(p[0] - 2)}" y="${f1(p[1] - 6)}" width="4" height="12" rx="1.5"/>` : `<rect class="eqf" x="${f1(p[0] - 6)}" y="${f1(p[1] - 2)}" width="12" height="4" rx="1.5"/>`,
    dbE: p => `<rect class="eqf" x="${f1(p[0] - 3.5)}" y="${f1(p[1] - 3.5)}" width="7" height="7" rx="2"/>`,
    cable: (a, b) => `<line class="cb" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`,
    hbar: (p, w = 9) => `<line class="eq" style="stroke-width:3.2" x1="${f1(p[0] - w)}" y1="${f1(p[1])}" x2="${f1(p[0] + w)}" y2="${f1(p[1])}"/>`,
    pad: (x, y, w, h) => `<rect class="eq" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`,
    post: (x, y1 = 2, y2 = 58) => G.ln([x, y1], [x, y2])

  return { solve, blend, at, total, svg, G, seg };
})();

  ev.preventDefault();
  const i = +ev.target.dataset.i;
  if (ev.target.dataset.in === 'w') { const r = document.querySelector(`[data-in="r"][data-i="${i}"]`); r && r.focus(); }
  else ev.target.blur();
});

// Begrüßung beim Öffnen der App (Opening-Szene)
function showSplash() {
  const el = document.getElementById('splash'); if (!el) return;
  const n = (PREF.name || '').trim();
  const nk = Object.keys(S.plan || {}).filter(k => k >= todayKey()).sort()[0];
  const next = nk ? `${nk === todayKey() ? 'Heute' : fmtKey(nk, { weekday: 'long' })}${S.plan[nk].t ? ' um ' + esc(S.plan[nk].t) : ''}: ${esc(planLabel(S.plan[nk]))}` : '';
  el.innerHTML = `<div class="sp-in"><div class="sp-logo">${icon('benchbb')}</div>
    <div class="sp-hi">Hallo${n ? ' ' + esc(n) : ''} 👋</div><div class="sp-sub">Bereit für dein nächstes Training?</div>
    ${next ? `<div class="sp-next">${calIcon(nk, 17)} ${next}</div>` : ''}<div class="sp-tap">Tippen zum Starten</div></div>`;
  el.classList.add('on');
  const hide = () => { el.classList.add('out'); setTimeout(() => { el.remove(); }, 450); };
  el.addEventListener('click', hide, { once: true });
  setTimeout(hide, 2600);
}

/* ================= Verkauf: Testphase + Lizenz (Lemon Squeezy) ================= */
// >>> Diese Werte nach dem Anlegen des Produkts bei Lemon Squeezy eintragen <<<
const LIC_CFG = {
  checkout: 'https://trainingstagebuch.lemonsqueezy.com/checkout/buy/07a06e55-a4fe-4125-9ded-8e576040bb84', // Kauf-Link ("Share" beim Produkt)
  storeId: 0,      // Store-ID (Settings → Stores). 0 = nicht prüfen
  productId: 0,    // Produkt-ID. 0 = nicht prüfen
  price: '4,99 €', // Anzeige in der App
  trialHours: 24,  // Testphase in Stunden
  recheckDays: 7,  // so oft wird der Code online nachgeprüft (z. B. nach Rückerstattung)
  allowTest: false // Codes aus Testkäufen (Testmodus) nicht akzeptieren
};
const LS_API = 'https://api.lemonsqueezy.com/v1/licenses/';
const T = (de, en) => LANG === 'en' ? en : de;
const Lic = {
  st: Object.assign({ trialStart: 0, key: '', inst: '', ok: false, checked: 0 }, lsGet('tt_lic') || {}),
  save() { lsSet('tt_lic', this.st); },
  unlocked() { return !!(this.st.key && this.st.ok); },
  left() { return this.st.trialStart + LIC_CFG.trialHours * 3600e3 - Date.now(); },
  inTrial() { return !this.unlocked() && this.left() > 0; },
  async call(path, data) {
    const r = await fetch(LS_API + path, { method: 'POST', headers: { Accept: 'application/json' }, body: new URLSearchParams(data) });
    let j = null; try { j = await r.json(); } catch (e) {}
    return { http: r.status, j: j || {} };
  },
  matches(meta, lk) {
    if (!LIC_CFG.allowTest && lk && lk.test_mode === true) return false;
    if (!meta) return true;
    if (LIC_CFG.storeId && +meta.store_id !== +LIC_CFG.storeId) return false;
    if (LIC_CFG.productId && +meta.product_id !== +LIC_CFG.productId) return false;
    return true;
  },
  async activate(key) {
    key = (key || '').trim();
    if (key.length < 8) throw new Error(T('Bitte gib deinen Lizenzcode ein.', 'Please enter your license key.'));
    let res;
    try { res = await this.call('activate', { license_key: key, instance_name: (/iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : 'Gerät') + ' ' + new Date().toISOString().slice(0, 10) }); }
    catch (e) { throw new Error(T('Keine Verbindung. Bitte prüfe dein Internet und versuche es noch einmal.', 'No connection. Please check your internet and try again.')); }
    const j = res.j;
    if (!j.activated) {
      const m = String(j.error || '');
      if (/limit/i.test(m)) throw new Error(T('Dieser Code ist schon auf der maximalen Anzahl Geräte aktiv.', 'This key is already active on the maximum number of devices.'));
      throw new Error(T('Dieser Code ist ungültig. Bitte prüfe die Eingabe (am besten aus der Kauf-Mail kopieren).', 'This key is not valid. Please check it (best copy it from your purchase email).'));
    }
    if (!this.matches(j.meta, j.license_key)) throw new Error(T('Dieser Code ist für diese App nicht gültig.', 'This key is not valid for this app.'));
    Object.assign(this.st, { key, inst: (j.instance && j.instance.id) || '', ok: true, checked: Date.now() }); this.save();
  },
  async recheck() {
    if (!this.st.key || Date.now() - this.st.checked < LIC_CFG.recheckDays * 864e5 || !navigator.onLine) return;
    try {
      const { http, j } = await this.call('validate', this.st.inst ? { license_key: this.st.key, instance_id: this.st.inst } : { license_key: this.st.key });
      if (j.valid === true && this.matches(j.meta, j.license_key)) { this.st.ok = true; this.st.checked = Date.now(); this.save(); }
      else if (j.valid === false || http === 404 || (j.valid === true && !this.matches(j.meta, j.license_key))) { this.st.ok = false; this.save(); this.gate(); }
    } catch (e) { /* offline o. ä.: Freischaltung bleibt bestehen */ }
  },
  fmtLeft() {
    const h = Math.max(0, this.left()) / 3600e3;
    return h >= 1 ? T(`noch ${Math.ceil(h)} Std.`, `${Math.ceil(h)} h left`) : T(`noch ${Math.max(1, Math.ceil(h * 60))} Min.`, `${Math.max(1, Math.ceil(h * 60))} min left`);
  },
  buy() { window.open(LIC_CFG.checkout, '_blank'); },
  overlay(kind) {
    document.getElementById('lic-ov')?.remove();
    const ov = document.createElement('div'); ov.id = 'lic-ov'; ov.className = 'lic-ov';
    const keyForm = `<div class="lic-key"><input class="f" id="lic-in" placeholder="${T('Lizenzcode aus der Kauf-Mail', 'License key from your purchase email')}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn block" data-lic="act">${T('Freischalten', 'Unlock')}</button><div class="lic-err" id="lic-err"></div></div>`;
    const logo = `<div class="sp-logo">${icon('benchbb')}</div>`;
    if (kind === 'welcome') ov.innerHTML = `<div class="lic-box">${logo}
      <div class="lic-h">${T('Willkommen!', 'Welcome!')}</div>
      <div class="lic-p">${T('Wie dürfen wir dich nennen?', 'What should we call you?')}</div>
      <input class="f" id="lic-name" placeholder="${T('Dein Vorname', 'Your first name')}" autocomplete="given-name" maxlength="30">
      <div class="lic-p small">${T(`Du kannst die App ${LIC_CFG.trialHours} Stunden lang kostenlos und ohne Einschränkungen testen. Danach schaltest du sie mit einem Einmalkauf für ${LIC_CFG.price} dauerhaft frei – kein Abo.`, `You can try the app free with no limits for ${LIC_CFG.trialHours} hours. Then unlock it for good with a one-time purchase of ${LIC_CFG.price} – no subscription.`)}</div>
      <button class="btn primary block" data-lic="start">${T('Test starten', 'Start trial')}</button>
      <details class="lic-have"><summary>${T('Ich habe schon einen Lizenzcode', 'I already have a license key')}</summary>${keyForm}</details></div>`;
    else if (kind === 'locked') ov.innerHTML = `<div class="lic-box">${logo}
      <div class="lic-h">${T('Deine Testphase ist vorbei', 'Your trial has ended')}</div>
      <div class="lic-p">${T(`Schalte die App mit einem Einmalkauf für ${LIC_CFG.price} dauerhaft frei. Alle deine Einträge bleiben erhalten.`, `Unlock the app for good with a one-time purchase of ${LIC_CFG.price}. All your entries are kept.`)}</div>
      <button class="btn primary block" data-lic="buy">${T(`Jetzt kaufen – ${LIC_CFG.price}`, `Buy now – ${LIC_CFG.price}`)}</button>
      <div class="lic-p small">${T('Nach dem Kauf bekommst du einen Lizenzcode per E-Mail:', 'After purchase you get a license key by email:')}</div>
      ${keyForm}
      <button class="linkbtn small" data-act="backup-file" style="margin-top:14px">${T('Backup meiner Daten sichern', 'Back up my data')}</button></div>`;
    else ov.innerHTML = `<div class="lic-box">${logo}
      <div class="lic-h">${T('App freischalten', 'Unlock the app')}</div>
      <div class="lic-p">${this.inTrial() ? T(`Testphase: ${this.fmtLeft()}.`, `Trial: ${this.fmtLeft()}.`) + ' ' : ''}${T(`Einmalkauf für ${LIC_CFG.price}, kein Abo.`, `One-time purchase of ${LIC_CFG.price}, no subscription.`)}</div>
      <button class="btn primary block" data-lic="buy">${T(`Jetzt kaufen – ${LIC_CFG.price}`, `Buy now – ${LIC_CFG.price}`)}</button>
      ${keyForm}
      <button class="btn block" data-lic="close" style="margin-top:10px">${T('Später', 'Later')}</button></div>`;
    ov.addEventListener('click', async e => {
      const b = e.target.closest('[data-lic]'); if (!b) return;
      const a = b.dataset.lic;
      if (a === 'buy') return this.buy();
      if (a === 'close') return ov.remove();
      if (a === 'start') {
        const n = (ov.querySelector('#lic-name').value || '').trim().slice(0, 30);
        if (n) { PREF.name = n; savePrefs(); }
        this.st.trialStart = Date.now(); this.save(); ov.remove(); render(); return;
      }
      if (a === 'act') {
        const err = ov.querySelector('#lic-err'); err.textContent = ''; b.disabled = true; b.textContent = T('Prüfe…', 'Checking…');
        try {
          await this.activate(ov.querySelector('#lic-in').value);
          if (!this.st.trialStart) this.st.trialStart = Date.now(), this.save();
          const nm = ov.querySelector('#lic-name'); if (nm && nm.value.trim()) { PREF.name = nm.value.trim().slice(0, 30); savePrefs(); }
          ov.remove(); render(); toast(T('Freigeschaltet – viel Spaß beim Training! 💪', 'Unlocked – enjoy your training! 💪'));
        } catch (x) { err.textContent = x.message; b.disabled = false; b.textContent = T('Freischalten', 'Unlock'); }
      }
    });
    document.body.appendChild(ov);
  },
  gate() {
    if (this.unlocked()) return;
    if (!this.st.trialStart) return this.overlay('welcome');
    if (this.left() <= 0) return this.overlay('locked');
    clearTimeout(this._t); this._t = setTimeout(() => this.gate(), Math.min(this.left() + 500, 2 ** 31 - 1));
  },
  banner() {
    if (!this.inTrial()) return;
    const m = document.getElementById('main'); if (!m) return;
    const d = document.createElement('button'); d.className = 'lic-bar'; d.dataset.licopen = '1';
    d.innerHTML = `<span>⏳ ${T('Testphase', 'Trial')} · ${this.fmtLeft()}</span><b>${T('Freischalten', 'Unlock')}</b>`;
    m.prepend(d);
  },
  settingsHTML() {
    return this.unlocked()
      ? `<label class="lab">${T('Lizenz', 'License')}</label><div class="small muted">✅ ${T('Freigeschaltet', 'Unlocked')} · ${esc(this.st.key.slice(0, 8))}…</div>`
      : `<label class="lab">${T('Lizenz', 'License')}</label><button class="btn block" data-licopen="1">${T('App freischalten', 'Unlock the app')}${this.inTrial() ? ' · ' + this.fmtLeft() : ''}</button>`;
  }
};
document.addEventListener('click', e => { if (e.target.closest('[data-licopen]')) { document.querySelector('.modal-bg')?.remove(); Lic.overlay('unlock'); } });
{ const _render = render; render = function () { _render(); Lic.banner(); }; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { Lic.gate(); Lic.recheck(); } });

Store.loadCache(); showSplash();
Store.init();
Lic.gate(); Lic.recheck();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
